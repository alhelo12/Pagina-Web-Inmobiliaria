[project]
name = "inmobiliaria-api"
version = "1.0.0"
description = "API sistema inmobiliario - FastAPI + PostgreSQL"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14.1",
    "anyio>=4.12.1",
    "bcrypt>=4.0.1",
    "bleach>=6.2.0",
    "cffi>=2.0.0",
    "cryptography>=46.0.5",
    "dnspython>=2.8.0",
    "ecdsa>=0.19.1",
    "email-validator>=2.3.0",
    "fastapi>=0.128.0",
    "greenlet>=3.3.1",
    "h11>=0.16.0",
    "httptools>=0.7.1",
    "passlib>=1.7.4",
    "psycopg2-binary>=2.9.11",
    "pyasn1>=0.6.2",
    "pycparser>=3.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.22",
    "pyyaml>=6.0.3",
    "rsa>=4.9.1",
    "six>=1.17.0",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.46",
    "structlog>=24.1.0",
    "uvicorn[standard]>=0.40.0",
    "watchfiles>=1.1.1",
    "websockets>=16.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.2",
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.8",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.9",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = false
